<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">

<rect width="500" height="300" rx="18" fill="#1E1E2E" stroke="#585B70" stroke-width="4"/>

<style>
.title {
  fill: #CDD6F4;
  font-size: 20px;
  font-family: Verdana, sans-serif;
  font-weight: bold;
}

.subtitle {
  fill: #CBA6F7;
  font-size: 12px;
  font-family: Verdana, sans-serif;
  font-weight: 600;
}

.label {
  fill: #CDD6F4;
  font-size: 11px;
  font-family: Verdana, sans-serif;
  font-weight: 600;
}

.rotate {
  animation: spin 12s linear infinite;
  transform-origin: 350px 170px;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>

<!-- TITLE -->
<text x="250" y="38" text-anchor="middle" class="title">
Most Used Technologies
</text>

<!-- SUBTITLE -->
<text x="25" y="67" class="subtitle">
Technology Distribution Across Projects
</text>

<!-- DONUT CHART -->
<g class="rotate">

<!-- JavaScript 60% -->
<circle
  cx="350"
  cy="170"
  r="82"
  fill="none"
  stroke="#f1e05a"
  stroke-width="52"
  stroke-dasharray="309.07 515.12"
  stroke-dashoffset="0"
  transform="rotate(-90 350 170)"
/>

<!-- Python 15% -->
<circle
  cx="350"
  cy="170"
  r="82"
  fill="none"
  stroke="#3572A5"
  stroke-width="52"
  stroke-dasharray="77.27 746.92"
  stroke-dashoffset="-309.07"
  transform="rotate(-90 350 170)"
/>

<!-- HTML 10% -->
<circle
  cx="350"
  cy="170"
  r="82"
  fill="none"
  stroke="#e34c26"
  stroke-width="52"
  stroke-dasharray="51.51 772.68"
  stroke-dashoffset="-386.34"
  transform="rotate(-90 350 170)"
/>

<!-- C++ 10% -->
<circle
  cx="350"
  cy="170"
  r="82"
  fill="none"
  stroke="#a855f7"
  stroke-width="52"
  stroke-dasharray="51.51 772.68"
  stroke-dashoffset="-437.85"
  transform="rotate(-90 350 170)"
/>

<!-- Other 5% -->
<circle
  cx="350"
  cy="170"
  r="82"
  fill="none"
  stroke="#9CA3AF"
  stroke-width="52"
  stroke-dasharray="25.76 798.43"
  stroke-dashoffset="-489.36"
  transform="rotate(-90 350 170)"
/>

</g>

<!-- SMALL DONUT HOLE -->
<circle
  cx="350"
  cy="170"
  r="30"
  fill="#1E1E2E"
/>

<!-- LEGEND -->
<g transform="translate(25,105)">

<rect width="16" height="16" rx="3" fill="#f1e05a"/>
<text x="25" y="13" class="label">JavaScript 60%</text>

<rect y="30" width="16" height="16" rx="3" fill="#3572A5"/>
<text x="25" y="43" class="label">Python 15%</text>

<rect y="60" width="16" height="16" rx="3" fill="#e34c26"/>
<text x="25" y="73" class="label">HTML 10%</text>

<rect y="90" width="16" height="16" rx="3" fill="#a855f7"/>
<text x="25" y="103" class="label">C++ 10%</text>

<rect y="120" width="16" height="16" rx="3" fill="#9CA3AF"/>
<text x="25" y="133" class="label">Other 5%</text>

</g>

</svg>
